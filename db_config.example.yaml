# Oracle database settings + the tables the chatbot may read (READ-ONLY text-to-SQL).
#
# HOW TO USE
#   1. Copy this file to  db_config.yaml  (same folder) and fill in your real values.
#   2. db_config.yaml is git-ignored, so the password is never committed. Keep THIS example file
#      free of real values - it is the template that goes into git.
#   3. If db_config.yaml is missing or still has placeholder values, the database feature is simply
#      switched off and the rest of the chatbot works as before. Restart the app after editing.
#
# The chatbot only ever sees the tables and columns listed below, and it can only run ONE read-only
# SELECT: no inserts/updates/deletes, no other tables, no hidden columns (see src/oracle_service.py).

oracle:
  user: YOUR_READONLY_USER            # best: a dedicated read-only Oracle user, not an admin account
  password: YOUR_PASSWORD
  # host:port/service_name   (or host:port:SID if your database uses a SID)
  dsn: db-host.example.com:1521/YOUR_SERVICE_NAME
  connect_timeout_seconds: 60
  # Oracle 12c or newer works out of the box ("Thin" mode, no client needed). Only for an old 11g server:
  # unpack Oracle Instant Client 19c (64-bit) and put its folder here, e.g. C:/oracle/instantclient_19_25
  client_lib_dir: ""

limits:
  max_rows: 200                       # most rows a query may return to the chatbot
  query_timeout_seconds: 30           # a query running longer than this is stopped

# Tables / views the chatbot may query. Only tables with enabled: true are used.
# Column TYPES are read from the database automatically. Good descriptions = better SQL.
tables:
  - name: TABLE_NAME                  # EXAMPLE - replace with a real table or view you own
    enabled: true                     # false = known but hidden from the chatbot
    description: "What one row of this table means. Mention traps, e.g. 'several rows per customer'."
    # Words in a question that make this table relevant (keeps the LLM prompt small). Regex alternatives.
    keywords: "docket|booking|freight"
    columns:
      - {name: COLUMN_ONE, description: "What this column holds"}
      - {name: COLUMN_TWO}
      - {name: COLUMN_DATE, description: "Booking date"}
    # Columns the chatbot must NEVER use or return (personal data, phone numbers, passwords ...).
    # They are blocked by name in every table.
    hidden_columns: []

# Date columns that tell the LLM which period each table covers. The data may not be live, so
# "last month", "this year", "recent" are read relative to the newest date in the column.
data_range:
  - table: TABLE_NAME
    column: COLUMN_DATE

# How the tables connect (confirm with your DBA).
joins:
  - TABLE_NAME.COLUMN_ONE = OTHER_TABLE.COLUMN_X

# Example questions with the SQL you consider correct (shown to the LLM). 5-10 real ones help a lot.
# Oracle SQL: no semicolon, use FETCH FIRST n ROWS ONLY or ROWNUM for limits.
examples:
  - question: How many records are there in total?
    sql: SELECT COUNT(*) AS TOTAL FROM TABLE_NAME
